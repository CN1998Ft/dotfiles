# Window padding and decorations
window_padding_width 5
hide_window_decorations no
window_margin_width 0 0 0
custom_shaders cursor-trail-motion-blur

# No bell
enable_audio_bell no
visual_bell_duration 0

# Font configuration
font_family      JetBrainsMonoNL Nerd Font Mono
bold_font        JetBrainsMonoNL Nerd Font Mono
italic_font      JetBrainsMonoNL Nerd Font Mono
bold_italic_font JetBrainsMonoNL Nerd Font Mono
font_size        13.0
symbol_map       U+E000-U+F8FF      Symbols Nerd Font Mono
symbol_map       U+F0000-U+FFFFD    Symbols Nerd Font Mono
symbol_map       U+100000-U+10FFFD  Symbols Nerd Font Mono

# Cursor style
cursor_shape     beam
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 4

# Mouse
mouse_hide_wait -1.0

# Layout
enabled_layouts Horizontal

# Keybindings
map ctrl+shift+n new_os_window
map alt+shift+d launch --cwd=current
map ctrl+shift+d new_tab_with_cwd

map ctrl+f1 goto_tab 1
map ctrl+f2 goto_tab 2
map ctrl+f3 goto_tab 3
map ctrl+f4 goto_tab 4
map ctrl+f5 goto_tab 5

map ctrl+f6 neighboring_window left
map ctrl+f7 neighboring_window bottom
map ctrl+f8 neighboring_window top
map ctrl+f9 neighboring_window right

# Colors (Github Dark High Contrast)
background #0a0c10
foreground #f0f3f6

cursor #71b7ff
cursor_text_color #0a0c10

color0 #7a828e
color1 #ff9492
color2 #26cd4d
color3 #f0b72f
color4 #71b7ff
color5 #cb9eff
color6 #39c5cf
color7 #d9dee3

color8  #9ea7b3
color9  #ffb1af
color10 #4ae168
color11 #f7c843
color12 #91cbff
color13 #cb9eff
color14 #39c5cf
color15 #d9dee3
